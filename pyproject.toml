[build-system]
requires = ["setuptools>=45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cowagent"
version = "1.0.0"
description = "CowAgent - AI Agent on WeChat and more"
# The codebase uses 3.10+ syntax (match statements, PEP 604 `X | Y` unions)
# and the Docker image is built on python:3.10-slim, so 3.10 is the real floor.
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
]

[project.scripts]
cow = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.ruff]
# Match the runtime floor declared in [project].requires-python. With py39 the
# linter parsed `match` statements as syntax errors (invalid-syntax) and
# mis-modelled PEP 604 unions; py310 reflects what the code actually targets.
target-version = "py310"
line-length = 120
extend-exclude = [
    "desktop",
    "docs",
    ".venv",
    ".fuxi",
]

[tool.ruff.lint]
# F = pyflakes (real bugs: unused imports, undefined names, dead code).
# These are the violations we gate CI on: a stray F-error usually means a real
# defect. E/W/B (style, whitespace, bugbear) are enabled for editor feedback but
# deliberately NOT fatal: the codebase carries thousands of legacy E501 long
# lines and B904 raise-without-from that would take a separate cleanup pass.
# F403/F405: star-imports are an intentional re-export pattern across channels
# and plugins (e.g. channel/chat_channel.py exposes Reply/ReplyType/ContextType
# for every channel subclass). Flagging them adds noise without catching bugs.
select = ["E", "F", "W", "B"]
ignore = [
    "F403",  # undefined-local-with-import-star (intentional re-export pattern)
    "F405",  # undefined-local-with-import-star-usage
]

[tool.ruff.lint.per-file-ignores]
# Modules that use try/except ImportError as an availability probe import the
# symbols for the probe and never use them again; keep the marker explicit.
"agent/tools/browser/browser_service.py" = ["F401"]
"common/package_manager.py" = ["F401"]
"voice/xunfei/xunfei_voice.py" = ["F401"]
# __init__.py re-exports the package's public API on purpose.
"agent/tools/vision/__init__.py" = ["F401"]
"plugins/cow_cli/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# Only the curated unit tests run in CI. The repo also ships ad-hoc scripts
# under skills/ and tasks_api/ that import heavy optional deps (fastapi, live
# credentials), so they are excluded from collection here.
testpaths = ["tests"]
addopts = "-q --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

