<!-- PuterXboss view (opencode-like panel) -->
<div class="view" id="view-puterxboss">
  <div class="section">
    <h2 class="title">PuterXboss</h2>
    <p class="subtitle">Local Bridge + limited model list</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="card">
      <label class="label">Model</label>
      <select id="puterxboss-model" class="select w-full" disabled>
        <option>Loading…</option>
      </select>
      <div class="mt-3">
        <label class="label">Agent / Mode</label>
        <input id="puterxboss-agent" class="input w-full" value="build" />
      </div>
      <div class="mt-3">
        <button id="puterxboss-run" class="btn w-full">Run (test)</button>
      </div>
      <div class="mt-3">
        <div id="puterxboss-status" class="text-sm opacity-80"></div>
      </div>
    </div>

    <div class="card">
      <label class="label">Prompt</label>
      <textarea id="puterxboss-prompt" class="textarea w-full" rows="6">ตอบแค่ ok</textarea>
      <div class="mt-3">
        <pre id="puterxboss-output" class="pre"></pre>
      </div>
    </div>
  </div>
</div>
