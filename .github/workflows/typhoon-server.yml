name: Typhoon Local Cloud Server (Cloudflare Tunnel)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/9b8a1dc1-novaagent-brandable

permissions:
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Show runner resources
        run: |
          echo "CPU: $(nproc)"
          free -h
          df -h /

      - name: Install llama.cpp CLI and cloudflared
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.llama/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Typhoon 12B OpenAI-compatible server
        env:
          NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NOVA_LLM_API_KEY" || { echo "NOVA_LLM_API_KEY secret is empty"; exit 1; }

          nohup llama serve -hf typhoon-ai/typhoon2.1-gemma3-12b-gguf:Q4_K_M \
            --host 0.0.0.0 --port 9931 -c 2048 -np 1 \
            -a typhoon-local --api-key "$NOVA_LLM_API_KEY" --no-webui >/tmp/server.log 2>&1 &
          echo $! >/tmp/typhoon-server.pid

          ready=false
          for i in $(seq 1 60); do
            sleep 10
            if curl -fsS -H "Authorization: Bearer $NOVA_LLM_API_KEY" http://127.0.0.1:9931/v1/models >/tmp/models.json; then
              echo "Authenticated model endpoint is ready."
              cat /tmp/models.json
              ready=true
              break
            fi
            if ! kill -0 "$(cat /tmp/typhoon-server.pid)" 2>/dev/null; then
              cat /tmp/server.log
              exit 1
            fi
          done
          if [ "$ready" != true ]; then
            echo "Model server did not become ready."
            cat /tmp/server.log
            exit 1
          fi

      - name: Publish private-key-protected endpoint through Cloudflare Quick Tunnel
        env:
          NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:9931 --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          tunnel_url=""
          for i in $(seq 1 60); do
            tunnel_url="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$tunnel_url" ]; then break; fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              cat /tmp/cloudflared.log
              exit 1
            fi
            sleep 5
          done
          test -n "$tunnel_url" || { cat /tmp/cloudflared.log; exit 1; }

          public_ready=false
          for i in $(seq 1 12); do
            if curl -fsS --max-time 20 -H "Authorization: Bearer $NOVA_LLM_API_KEY" \
              "${tunnel_url}/v1/models" >/tmp/public-models.json; then
              echo "Authenticated public tunnel check passed."
              public_ready=true
              break
            fi
            sleep 5
          done
          if [ "$public_ready" != true ]; then
            echo "Public endpoint authentication/readiness check failed; URL will not be published."
            cat /tmp/cloudflared.log
            exit 1
          fi

          if ! curl -fsS --max-time 180 -H "Authorization: Bearer $NOVA_LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"typhoon-local","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":8,"stream":false}' \
            "${tunnel_url}/v1/chat/completions" >/tmp/public-chat-test.json; then
            echo "Public chat-completion smoke test failed; URL will not be published."
            exit 1
          fi
          python3 - <<'PY'
import json
with open("/tmp/public-chat-test.json", encoding="utf-8") as f:
    data = json.load(f)
choices = data.get("choices") or []
if not choices or not (choices[0].get("message", {}).get("content") or "").strip():
    raise SystemExit("Chat-completion response did not contain assistant text")
print("Authenticated public chat-completion smoke test passed.")
PY

          echo "=== TYPHOON CLOUD ENDPOINT ==="
          echo "API base: ${tunnel_url}/v1"
          echo "Model alias: typhoon-local"
          echo "Model: Typhoon 2.1 Gemma3 12B Q4_K_M"
          echo "Authentication: Bearer API key (NOVA_LLM_API_KEY GitHub Secret)"
          echo "Keep this URL and API key private. The tunnel URL is temporary."

      - name: Keep the model server and tunnel online
        run: |
          set -euo pipefail
          echo "Server and tunnel stay online until this GitHub Actions job ends."
          for i in $(seq 1 660); do
            kill -0 "$(cat /tmp/typhoon-server.pid)" || {
              cat /tmp/server.log
              exit 1
            }
            kill -0 "$(cat /tmp/cloudflared.pid)" || {
              cat /tmp/cloudflared.log
              exit 1
            }
            sleep 10
          done
