name: Typhoon Local Server (12B)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/9b8a1dc1-novaagent-brandable
      - main

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools & HuggingFace CLI
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.llama/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          pip install -U huggingface_hub

      - name: Download Typhoon 12B via HF CLI
        run: |
          set -euo pipefail
          echo "📥 Downloading Typhoon 12B GGUF Model (~7.3 GB)..."
          huggingface-cli download scb10x/typhoon2-12b-instruct-gguf typhoon2-12b-instruct-Q4_K_M.gguf --local-dir /tmp --local-dir-use-symlinks False
          mv /tmp/typhoon2-12b-instruct-Q4_K_M.gguf /tmp/model.gguf
          ls -lh /tmp/model.gguf

      - name: Start Typhoon 12B Server
        env:
          NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NOVA_LLM_API_KEY:-}" ]; then
            echo "❌ ERROR: NOVA_LLM_API_KEY secret is empty!"
            exit 1
          fi

          nohup llama serve -m /tmp/model.gguf \
            --host 0.0.0.0 --port 9931 -c 2048 -np 1 \
            -a typhoon-local --api-key "$NOVA_LLM_API_KEY" --no-webui >/tmp/server.log 2>&1 &
          echo $! > /tmp/typhoon-server.pid

          ready=false
          for i in $(seq 1 60); do
            sleep 5
            if curl -fsS -H "Authorization: Bearer $NOVA_LLM_API_KEY" http://127.0.0.1:9931/v1/models >/tmp/models.json 2>/dev/null; then
              ready=true
              break
            fi
          done

          if [ "$ready" != "true" ]; then
            echo "❌ Model Server Start Failed:"
            cat /tmp/server.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        env:
          NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:9931 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          tunnel_url=""
          for i in $(seq 1 20); do
            tunnel_url=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$tunnel_url" ]; then break; fi
            sleep 3
          done

          if [ -z "$tunnel_url" ]; then
            echo "❌ Cloudflare Tunnel Failed:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "=========================================="
          echo "🎉 PUBLIC ENDPOINT READY"
          echo "API Base: ${tunnel_url}/v1"
          echo "Model: typhoon-local"
          echo "=========================================="

      - name: Keep Server Alive
        run: |
          set -euo pipefail
          for i in $(seq 1 660); do
            kill -0 "$(cat /tmp/typhoon-server.pid)" || { cat /tmp/server.log; exit 1; }
            kill -0 "$(cat /tmp/cloudflared.pid)" || { cat /tmp/cloudflared.log; exit 1; }
            sleep 10
          done
