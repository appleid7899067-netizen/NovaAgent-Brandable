name: Run Gemma-7B (free)

on:
  workflow_dispatch:

jobs:
  gemma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call Gemma-7B via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({
                  "model": "meta-llama/llama-3.1-8b-instruct:free",
                  "messages": [{
                      "role": "user",
                      "content": "สรุปการทำงานของ GitHub Actions ให้เข้าใจง่าย",
                  }],
                  "max_tokens": 300,
              }, f, ensure_ascii=False)
          PY

          curl -sS -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@request.json" \
            -o response.json

          python3 - <<'PY' > gemma_output.txt
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)
          if "error" in data:
              raise SystemExit(str(data["error"]))
          print(data["choices"][0]["message"]["content"])
          PY

      - name: Upload Gemma output
        uses: actions/upload-artifact@v4
        with:
          name: gemma-output
          path: gemma_output.txt
