name: docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/9b8a1dc1-novaagent-brandable
    paths:
      - "docker/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main
      - arena/9b8a1dc1-novaagent-brandable
    paths:
      - "docker/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: standard
            dockerfile: docker/Dockerfile.latest
            build_args: ""
          - name: no-browser
            dockerfile: docker/Dockerfile.latest
            build_args: "--build-arg INSTALL_BROWSER=false"
      fail-fast: false

    name: Build (${{ matrix.variant.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          build-args: ${{ matrix.variant.build_args }}
          push: false
          load: true
          tags: panupangrok:${{ matrix.variant.name }}-test
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}

      - name: Verify image runs
        run: |
          # --entrypoint bypasses the bot launcher (entrypoint.sh runs the bot,
          # which never exits and used to make this step hang until the 6h limit).
          # `timeout` is a second safety net so a regression fails fast.
          timeout 120 docker run --rm --entrypoint python \
            panupangrok:${{ matrix.variant.name }}-test --version
          timeout 120 docker run --rm --entrypoint pip \
            panupangrok:${{ matrix.variant.name }}-test list | head -20
          # Also exercise the entrypoint's arg passthrough path.
          timeout 120 docker run --rm panupangrok:${{ matrix.variant.name }}-test \
            python -c "import sys; print('python', sys.version.split()[0])"
